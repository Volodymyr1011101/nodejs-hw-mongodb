tags:
  - Auth
summary: Register new user
operationId: registerUser
description: |
  Реєстрація нового користувача. Якщо email вже використовується — повертається помилка 409.
  Після успішної реєстрації надсилається лист для підтвердження email.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - email
          - password
          - name
        properties:
          email:
            type: string
            format: email
            example: user@example.com
          password:
            type: string
            format: password
            minLength: 8
            example: secret123
          name:
            type: string
            example: JohnDoe
responses:
  '201':
    description: User successfully registered
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a user!
            data:
              type: object
              required:
                - email
                - username
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                username:
                  type: string
                  example: JohnDoe
  '409':
    description: Email already in use
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 409
            message:
              type: string
              example: Email in use
  '500':
    description: Server error