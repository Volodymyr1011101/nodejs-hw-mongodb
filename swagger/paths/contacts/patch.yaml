tags:
  - Contacts
summary: Patch contact by ID
operationId: PatchContact
description: Update specific contact fields by ID
security:
  - bearerAuth: [ ]
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
    description: Contact ID
requestBody:
  required: false
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Volodymyr
          phoneNumber:
            type: string
            example: 690322769
          email:
            type: string
            format: email
            example: voronkinvladimir328@gmail.com
          isFavourite:
            type: boolean
            example: true
          contactType:
            type: string
            enum: [ work, home, personal ]
            example: home
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Contact successfully updated
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: '../../component/contact.yaml'
  '404':
    $ref: '../../statuses/404.yaml'
  '401':
    $ref: '../../statuses/401.yaml'