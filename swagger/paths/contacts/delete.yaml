tags:
  - Contacts
summary: Delete contact by ID
operationId: DeleteContact
description: Deletes a contact belonging to the authenticated user
security:
  - bearerAuth: [ ]
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      format: uuid
    description: Unique identifier of the contact to delete
responses:
  '204':
    description: Contact was successfully deleted. No content is returned in the response.
  '401':
    $ref: '../../statuses/401.yaml'
  '404':
    $ref: '../../statuses/404.yaml'