tags:
  - Contacts
summary: Get contacts List
operationId: GetContacts
description: Get list of contacts
security:
  - bearerAuth: [ ]
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
  - in: query
    name: perPage
    schema:
      type: integer
      example: 10
  - in: query
    name: isFavourite
    schema:
      type: boolean
      example: true
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [ 'asc', 'desc' ]
      example: asc
  - in: query
    name: type
    schema:
      type: string
      enum: [ 'work', 'home', 'personal' ]
      example: home
responses:
  '200':
    description: 'Successfully found contacts!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasPreviousPage
                - hasNextPage
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../component/contact.yaml'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 10
                totalPages:
                  type: integer
                  example: 1
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: false
  '400':
    description: 'Could not find contacts'
    content:
      application/json":
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Could not find contacts
  '401':
    $ref: '../../statuses/401.yaml'